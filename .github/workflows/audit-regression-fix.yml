name: Audit Regression Fix

on:
  push:
    branches:
      - feature/game-detail-download-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply regression fixes
        run: python3 tools/audit-regression-fix.py

      - name: Validate focused checks
        run: |
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:privacy
          npm run check:data
          npm run check:routes
          npm run security:scan -- --skip-npm-audit

      - name: Commit final fixes and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/audit-regression-fix.py .github/workflows/audit-regression-fix.yml
          git add src/features/game-finder/types.ts src/features/game-finder/hardware-storage.ts src/features/game-finder/GameFinderClient.tsx src/features/game-finder/browser-detection.ts src/components/layout/Header.tsx tools/check-data.mjs tools/build-secure-deploy.mjs
          git commit -m "fix: cerrar regresiones finales de auditoría"
          git push origin HEAD:feature/game-detail-download-v2
