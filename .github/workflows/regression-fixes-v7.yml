name: Regression Fixes V7

on:
  push:
    branches:
      - feature/game-detail-download-v2
    paths:
      - .github/workflows/regression-fixes-v7.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/game-detail-download-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply regression fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/features/game-finder/GameFinderClient.tsx';
          let text = fs.readFileSync(path, 'utf8');

          const oldSource = `function detectionSource(\n  profile: HardwareProfile | null,\n  snapshot: BrowserHardwareSnapshot | null\n) {\n  if (snapshot) return sourceLabel(snapshot);\n  if (profile?.source === \"manual\") return \"Entrada manual\";\n  if (profile?.source === \"saved\") return \"Perfil local\";\n  if (profile?.source === \"example\") return \"Ejemplo local\";\n  return \"Sin lectura automática\";\n}`;
          const newSource = `function detectionSource(\n  profile: HardwareProfile | null,\n  snapshot: BrowserHardwareSnapshot | null\n) {\n  // El origen visible debe describir el perfil que realmente está usando el\n  // cálculo. Un snapshot automático anterior no debe eclipsar un perfil\n  // manual, guardado o de demostración que esté activo ahora.\n  if (profile?.source === \"manual\") return \"Entrada manual\";\n  if (profile?.source === \"saved\") return \"Perfil local\";\n  if (profile?.source === \"example\") return \"Ejemplo local\";\n  if (snapshot) return sourceLabel(snapshot);\n  return \"Sin lectura automática\";\n}`;

          if (!text.includes(oldSource)) throw new Error('No se encontró detectionSource esperado');
          text = text.replace(oldSource, newSource);

          const oldHint = `  if (snapshot?.secureContext === false) {\n    return \"Estás usando una conexión HTTP de red local: la web funciona, pero WebGPU y parte de la detección avanzada pueden quedar limitados. Para una lectura más completa usa HTTPS o localhost.\";\n  }\n  if (state === \"error\") {\n    return \"Puedes configurar CPU, GPU y RAM manualmente sin instalar nada.\";\n  }\n  if (state === \"partial\") {\n    return \"Parte del hardware está protegida; confirma los componentes para mejorar los FPS estimados.\";\n  }\n  if (profile?.source === \"manual\" || profile?.source === \"saved\") {\n    return \"Este perfil local se usa para calcular los rangos de FPS del catálogo.\";\n  }\n  if (profile?.source === \"example\") {\n    return \"El ejemplo no reemplaza el perfil guardado de tu PC.\";\n  }`;
          const newHint = `  // Las limitaciones del snapshot sólo importan mientras el perfil activo sea\n  // realmente una detección web. Si el usuario ya confirmó los componentes,\n  // ese perfil es la fuente del cálculo y no debe heredar avisos antiguos.\n  if (profile?.source === \"manual\" || profile?.source === \"saved\") {\n    return \"Este perfil local se usa para calcular los rangos de FPS del catálogo.\";\n  }\n  if (profile?.source === \"example\") {\n    return \"El ejemplo no reemplaza el perfil guardado de tu PC.\";\n  }\n  if (snapshot?.secureContext === false) {\n    return \"Estás usando una conexión HTTP de red local: la web funciona, pero WebGPU y parte de la detección avanzada pueden quedar limitados. Para una lectura más completa usa HTTPS o localhost.\";\n  }\n  if (state === \"error\") {\n    return \"Puedes configurar CPU, GPU y RAM manualmente sin instalar nada.\";\n  }\n  if (state === \"partial\") {\n    return \"Parte del hardware está protegida; confirma los componentes para mejorar los FPS estimados.\";\n  }`;

          if (!text.includes(oldHint)) throw new Error('No se encontró detectionHint esperado');
          text = text.replace(oldHint, newHint);

          const oldFocus = `    const first = focusable[0];\n    const last = focusable[focusable.length - 1];\n    const active = document.activeElement;\n\n    if (event.shiftKey && active === first) {\n      event.preventDefault();\n      last.focus();\n    } else if (!event.shiftKey && active === last) {\n      event.preventDefault();\n      first.focus();\n    }`;
          const newFocus = `    const first = focusable[0];\n    const last = focusable[focusable.length - 1];\n    const active = document.activeElement;\n    const activeIsFocusable =\n      active instanceof HTMLElement &&\n      Array.from(focusable).includes(active);\n\n    // El diálogo recibe el foco inicial mediante tabIndex=-1. Desde ese punto,\n    // Tab debe entrar por el primer control y Shift+Tab por el último, sin\n    // permitir que el foco escape hacia la página que queda detrás del modal.\n    if (!activeIsFocusable) {\n      event.preventDefault();\n      (event.shiftKey ? last : first).focus();\n      return;\n    }\n\n    if (event.shiftKey && active === first) {\n      event.preventDefault();\n      last.focus();\n    } else if (!event.shiftKey && active === last) {\n      event.preventDefault();\n      first.focus();\n    }`;

          if (!text.includes(oldFocus)) throw new Error('No se encontró bloque de focus trap esperado');
          text = text.replace(oldFocus, newFocus);

          fs.writeFileSync(path, text);
          NODE

      - name: Validate focused checks
        run: |
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:source

      - name: Commit fixes and remove temporary automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regression-fixes-v7.yml
          git add src/features/game-finder/GameFinderClient.tsx
          git commit -m "fix: alinear perfil activo y foco del modal"
          git push origin HEAD:feature/game-detail-download-v2
