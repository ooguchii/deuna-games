name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail

          forbidden='(^|/)(DEUNA_ANALISIS_COMPLETO|legacy-archive|theme-recovery-backup-[^/]*|payload)(/|$)|(^|/)(PROJECT_CONTEXT|PROJECT_REVIEW|PROJECT_AUDIT|PROJECT_COLOR_AUDIT|PROJECT_VISUAL_AUDIT|DEBUG_REPORT).*\.md$|(^|/)(APLICAR-|REPARAR-|RECUPERAR-|LIMPIEZA-SEGURA-|PREPARAR-DEUNA-|FIX-|FORZAR-|LIMPIAR-).*\.ps1$|^src/theme/palette\.ts$'

          if git ls-files | grep -E "$forbidden"; then
            echo "::error::El repositorio contiene archivos históricos, generados o de reparación que deben permanecer fuera del código activo."
            exit 1
          fi

          sensitive='(^|/)\.env($|\.)|\.(pem|key|p12|pfx|kdbx|crt|cer|backup|dump)$|\.sql\.gz$|(^|/)pg_dump[^/]*$'
          sensitive_matches="$(git ls-files | grep -E "$sensitive" | grep -v '^\.env\.example$' || true)"

          if [ -n "$sensitive_matches" ]; then
            printf '%s\n' "$sensitive_matches"
            echo "::error::Se detectaron archivos sensibles trackeados por Git."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ github.event.pull_request.number || 'master' }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ github.event.pull_request.number || 'master' }}-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture
        run: npm run check:architecture

      - name: Maintenance invariants
        run: npm run check:maintenance

      - name: Source hygiene
        run: npm run check:source

      - name: Privacy invariants
        run: npm run check:privacy

      - name: Admin security invariants
        run: npm run check:admin-security

      - name: Admin editorial import
        run: npm run check:admin-content

      - name: Text encoding
        run: npm run check:encoding

      - name: Data integrity
        run: npm run check:data

      - name: Asset integrity
        run: npm run check:assets

      - name: Route integrity
        run: npm run check:routes

      - name: CSS variable integrity
        run: npm run check:css-vars

      - name: CSS Modules integrity
        run: npm run check:css-modules

      - name: Security scan
        run: npm run security:scan -- --skip-npm-audit

      - name: Build
        run: npm run build

      - name: Runtime smoke
        run: npm run smoke

      - name: Dependency audit
        run: npm run audit:deps

  postgres-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_TELEMETRY_DISABLED: 1
      DEUNA_ADMIN_ENABLED: "false"
      DEUNA_ADMIN_SESSION_HOURS: "8"
      DEUNA_ADMIN_ORIGIN: https://example.invalid
      DEUNA_ACCOUNT_SESSION_DAYS: "30"
      DEUNA_DATABASE_HOST: 127.0.0.1
      DEUNA_DATABASE_PORT: "5432"
      DEUNA_DATABASE_NAME: deuna_games
      DEUNA_DATABASE_USER: deuna_runtime
      DEUNA_DATABASE_MIGRATION_USER: deuna_migrator
      DEUNA_DATABASE_SSL: "false"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Provision isolated PostgreSQL roles
        shell: bash
        run: |
          set -euo pipefail

          migration_credential="$(openssl rand -hex 32)"
          runtime_credential="$(openssl rand -hex 32)"
          account_data_key="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")"

          echo "::add-mask::$migration_credential"
          echo "::add-mask::$runtime_credential"
          echo "::add-mask::$account_data_key"

          printf 'DEUNA_DATABASE_MIGRATION_PASSWORD=%s\n' "$migration_credential" >> "$GITHUB_ENV"
          printf 'DEUNA_DATABASE_PASSWORD=%s\n' "$runtime_credential" >> "$GITHUB_ENV"
          printf 'DEUNA_ACCOUNT_DATA_KEY=%s\n' "$account_data_key" >> "$GITHUB_ENV"

          docker exec -i "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U postgres <<'SQL'
          CREATE ROLE deuna_migrator
            LOGIN
            NOINHERIT
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOREPLICATION
            NOBYPASSRLS;

          CREATE ROLE deuna_runtime
            LOGIN
            NOINHERIT
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOREPLICATION
            NOBYPASSRLS;

          CREATE DATABASE deuna_games
            OWNER deuna_migrator
            ENCODING 'UTF8'
            TEMPLATE template0;

          REVOKE ALL ON DATABASE deuna_games FROM PUBLIC;
          GRANT CONNECT ON DATABASE deuna_games
            TO deuna_migrator, deuna_runtime;
          SQL

      - name: Apply migrations 001-011
        run: node ./tools/admin/migrate.ts

      - name: Import editorial fixtures
        run: node ./tools/admin/import-content.ts

      - name: Create isolated owner fixture
        shell: bash
        run: |
          set -euo pipefail

          docker exec -i "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U postgres -d deuna_games <<'SQL'
          INSERT INTO deuna_admin.admin_users
            (
              id,
              username,
              username_key,
              role,
              password_hash,
              display_name,
              active
            )
          VALUES
            (
              '00000000-0000-4000-8000-000000000001',
              'ci_owner',
              'ci_owner',
              'owner',
              'ci-owner-password-hash-placeholder',
              'CI Owner',
              true
            );
          SQL

      - name: Migration preflight against PostgreSQL
        run: node ./tools/admin/preflight.ts --purpose=migration

      - name: Runtime preflight against PostgreSQL
        env:
          NODE_ENV: production
        run: node ./tools/admin/preflight.ts --purpose=runtime

      - name: Runtime account privilege integration
        env:
          NODE_ENV: production
        run: npm run check:account-postgres
