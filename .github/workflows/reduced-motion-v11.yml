name: Reduced Motion V11

on:
  push:
    branches:
      - feature/game-detail-download-v2
    paths:
      - .github/workflows/reduced-motion-v11.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-detail-download-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply reduced motion fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/features/game-finder/GameFinderClient.module.css';
          let text = fs.readFileSync(file, 'utf8');
          const oldBlock = `@media (prefers-reduced-motion: reduce) {\n  .gameCard,\n  .gameCardImage,\n  .gameCardSpotlight,\n  .gameCard::before,\n  .favoriteButton,\n  .tierFilter {\n    transition: none !important;\n  }\n\n  .gameCard,\n  .gameCard:hover {\n    transform: none !important;\n  }\n\n  .gameCardImage,\n  .gameCard:hover .gameCardImage {\n    transform: none !important;\n  }\n}`;
          const newBlock = `@media (prefers-reduced-motion: reduce) {\n  .gameCard,\n  .gameCardImage,\n  .favoriteButton,\n  .tierFilter,\n  .detailPrimaryLink {\n    transition: none !important;\n  }\n\n  .gameCard,\n  .gameCard:hover,\n  .gameCardImage,\n  .gameCard:hover .gameCardImage,\n  .favoriteButton:hover,\n  .tierFilter:hover,\n  .detailPrimaryLink:hover {\n    transform: none !important;\n  }\n\n  .gameCard::before,\n  .gameCardSpotlight {\n    display: none;\n  }\n}`;
          if (!text.includes(oldBlock)) throw new Error('reduced motion block not found');
          text = text.replace(oldBlock, newBlock);
          fs.writeFileSync(file, text);
          NODE
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run check:css-modules
          npm run check:css-vars
          npm run check:source
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reduced-motion-v11.yml
          git add src/features/game-finder/GameFinderClient.module.css
          git commit -m "fix: respetar movimiento reducido en requisitos"
          git push origin HEAD:feature/game-detail-download-v2
