name: Audit Finisher

on:
  push:
    branches:
      - feature/game-detail-download-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply audit fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact("src/features/game-finder/hardware-storage.ts", 'import "./hardware-catalog-expansion";\n\n', "")
          replace_exact("src/features/game-finder/performance-model.ts", "  fps = Math.max(8, fps);", "  fps = Math.max(0, fps);")
          replace_exact("src/features/game-finder/performance-model.ts", "  const minFps = Math.max(\n    5,\n    fps * (1 - spread) * ramModel.lowRangeFactor\n  );", "  const minFps = Math.max(\n    0,\n    fps * (1 - spread) * ramModel.lowRangeFactor\n  );")
          replace_exact("src/features/game-finder/GameFinderClient.tsx", '    os: profile?.os && profile.os !== "Sistema sin confirmar"\n      ? profile.os\n      : "Windows 11 64-bit",', '    os: profile?.os && profile.os !== "Sistema sin confirmar"\n      ? profile.os\n      : "Otro / no estoy seguro",')
          replace_exact("src/features/game-finder/GameFinderClient.tsx", "                    <option>Windows 11 64-bit</option>\n                    <option>Windows 10 64-bit</option>", "                    <option>Windows 10/11 64-bit</option>\n                    <option>Windows 10/11</option>\n                    <option>Windows 11 64-bit</option>\n                    <option>Windows 10 64-bit</option>")
          replace_exact("src/components/updates/UpdatesCatalogClient.tsx", "              y combiná los filtros.", "              y combina los filtros.")
          replace_exact("src/components/updates/UpdatesCatalogClient.tsx", """                  <Link
                    key={
                      update.id
                    }
                    href={`/juegos/${update.game.slug}/descargar`}
                  >""", """                  <Link
                    key={
                      update.id
                    }
                    href={
                      update.downloadable
                        ? `/juegos/${update.game.slug}/descargar`
                        : `/juegos/${update.game.slug}`
                    }
                  >""")

          wrapper_replacements = {
              "src/components/home/PopularGames.tsx": [
                  ('import CardCarousel from "@/components/ui/CardCarousel";\n', 'import CardCarousel from "@/components/ui/CardCarousel";\nimport UniversalGameCard from "@/components/ui/UniversalGameCard";\n'),
                  ('\nimport GameCard from "./GameCard";', ''),
                  ('          <GameCard\n            key={game.slug}\n            game={game}\n          />', '          <UniversalGameCard\n            key={game.slug}\n            game={game}\n            variant="standard"\n          />'),
              ],
              "src/components/home/RecommendedGames.tsx": [
                  ('import CardCarousel from "@/components/ui/CardCarousel";\n', 'import CardCarousel from "@/components/ui/CardCarousel";\nimport UniversalGameCard from "@/components/ui/UniversalGameCard";\n'),
                  ('\nimport GameCard from "./GameCard";', ''),
                  ('          <GameCard\n            key={game.slug}\n            game={game}\n          />', '          <UniversalGameCard\n            key={game.slug}\n            game={game}\n            variant="standard"\n          />'),
              ],
              "src/components/home/RecentlyAdded.tsx": [
                  ('import CardCarousel from "@/components/ui/CardCarousel";\n', 'import CardCarousel from "@/components/ui/CardCarousel";\nimport UniversalGameCard from "@/components/ui/UniversalGameCard";\n'),
                  ('\nimport RecentGameCard from "./RecentGameCard";', ''),
                  ('          <RecentGameCard\n            key={game.slug}\n            game={game}\n          />', '          <UniversalGameCard\n            key={game.slug}\n            game={game}\n            variant="recent"\n          />'),
              ],
              "src/components/home/GamesForYourPC.tsx": [
                  ('import CardCarousel from "@/components/ui/CardCarousel";\n', 'import CardCarousel from "@/components/ui/CardCarousel";\nimport UniversalGameCard from "@/components/ui/UniversalGameCard";\n'),
                  ('\nimport LowSpecGameCard from "./LowSpecGameCard";', ''),
                  ('          <LowSpecGameCard\n            key={game.slug}\n            game={game}\n          />', '          <UniversalGameCard\n            key={game.slug}\n            game={game}\n            variant="low-spec"\n          />'),
              ],
          }
          for path, pairs in wrapper_replacements.items():
              for old, new in pairs:
                  replace_exact(path, old, new)
          for path in ["src/components/home/GameCard.tsx", "src/components/home/LowSpecGameCard.tsx", "src/components/home/RecentGameCard.tsx"]:
              Path(path).unlink()

          replace_exact("src/components/layout/Header.tsx", 'import Link from "next/link";\n', '"use client";\n\nimport Link from "next/link";\nimport { useCallback, useEffect, useRef, useState } from "react";\n')
          replace_exact("src/components/layout/Header.tsx", "export default function Header() {\n  return (", """export default function Header() {
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const menuButtonRef = useRef<HTMLButtonElement>(null);
  const mobilePanelRef = useRef<HTMLDivElement>(null);

  const closeMobileMenu = useCallback((restoreFocus = false) => {
    setMobileMenuOpen(false);
    if (restoreFocus) {
      window.requestAnimationFrame(() => menuButtonRef.current?.focus());
    }
  }, []);

  useEffect(() => {
    if (!mobileMenuOpen) return;
    const previousOverflow = document.body.style.overflow;
    const desktopMedia = window.matchMedia("(min-width: 1161px)");
    document.body.style.overflow = "hidden";

    const handleKeyDown = (event: KeyboardEvent) => {
      if (event.key === "Escape") {
        event.preventDefault();
        closeMobileMenu(true);
      }
    };
    const handleDesktop = () => {
      if (desktopMedia.matches) closeMobileMenu(false);
    };

    document.addEventListener("keydown", handleKeyDown);
    desktopMedia.addEventListener("change", handleDesktop);
    window.requestAnimationFrame(() => {
      mobilePanelRef.current?.querySelector<HTMLInputElement>('input[type="search"]')?.focus();
    });

    return () => {
      document.body.style.overflow = previousOverflow;
      document.removeEventListener("keydown", handleKeyDown);
      desktopMedia.removeEventListener("change", handleDesktop);
    };
  }, [closeMobileMenu, mobileMenuOpen]);

  return (""")
          replace_exact("src/components/layout/Header.tsx", """      <input
        id={MOBILE_MENU_ID}
        type="checkbox"
        className={styles.mobileMenuToggle}
        aria-label="Abrir o cerrar menú"
        aria-controls="mobile-navigation"
      />""", """      <input
        id={MOBILE_MENU_ID}
        type="checkbox"
        className={styles.mobileMenuToggle}
        checked={mobileMenuOpen}
        readOnly
        aria-hidden="true"
        tabIndex={-1}
      />""")
          replace_exact("src/components/layout/Header.tsx", """            <label
              htmlFor={MOBILE_MENU_ID}
              className={styles.menuButton}
              aria-label="Abrir o cerrar menú"
              title="Menú"
            >""", """            <button
              ref={menuButtonRef}
              type="button"
              className={styles.menuButton}
              aria-label={mobileMenuOpen ? "Cerrar menú" : "Abrir menú"}
              aria-expanded={mobileMenuOpen}
              aria-controls="mobile-navigation"
              title={mobileMenuOpen ? "Cerrar menú" : "Abrir menú"}
              onClick={() => setMobileMenuOpen((current) => !current)}
            >""")
          replace_exact("src/components/layout/Header.tsx", """            </label>
          </div>""", """            </button>
          </div>""")
          replace_exact("src/components/layout/Header.tsx", """      <div
        id="mobile-navigation"
        className={styles.mobileNativePanel}
      >""", """      <div
        id="mobile-navigation"
        ref={mobilePanelRef}
        className={styles.mobileNativePanel}
        aria-hidden={!mobileMenuOpen}
        onClick={(event) => {
          if ((event.target as HTMLElement).closest("a")) closeMobileMenu(false);
        }}
      >""")
          replace_exact("src/components/layout/Header.tsx", """          <form
            className={styles.mobileSearch}
            action="/juegos"
            role="search"
          >""", """          <form
            className={styles.mobileSearch}
            action="/juegos"
            role="search"
            onSubmit={() => closeMobileMenu(false)}
          >""")
          replace_exact("src/components/layout/Header.module.css", ".mobileMenuToggle:focus-visible\n~ .header\n.menuButton {", ".menuButton:focus-visible {")

          replace_exact("tools/build-secure-deploy.mjs", """const stageBase =
  process.platform === "win32"
    ? path.resolve(
        `${process.env.SystemDrive || "C:"}${path.sep}`,
        "DeUnaSecureBuild"
      )
    : path.join(
        os.tmpdir(),
        "deuna-secure-build"
      );""", """const stageBase = path.resolve(
  process.env.DEUNA_SECURE_STAGE_DIR?.trim() ||
    path.join(
      os.tmpdir(),
      "deuna-secure-build"
    )
);""")
          replace_exact("tools/build-secure-deploy.mjs", """  const result = spawnSync(
    "npm",
    args,
    {
      cwd,
      env: process.env,
      stdio: "inherit",
      shell:
        process.platform ===
        "win32",
    }
  );""", """  const npmCommand =
    process.platform === "win32"
      ? "npm.cmd"
      : "npm";

  const result = spawnSync(
    npmCommand,
    args,
    {
      cwd,
      env: process.env,
      stdio: "inherit",
      shell: false,
    }
  );""")
          replace_exact("tools/build-secure-deploy.mjs", '  "lint",\n  "typecheck",\n  "check:source",', '  "lint",\n  "typecheck",\n  "check:architecture",\n  "check:source",')

          neutral_replacements = {
              "Configurá": "Configura", "configurá": "configura", "Revisá": "Revisa", "revisá": "revisa",
              "Subí": "Sube", "subí": "sube", "Retirá": "Retira", "retirá": "retira",
              "Eliminá": "Elimina", "eliminá": "elimina", "Conectá": "Conecta", "conectá": "conecta",
              "Dejá": "Deja", "dejá": "deja", "Detenelo": "Detén el proceso", "detenelo": "detén el proceso",
              "arrancalo": "inícialo", "Arrancalo": "Inícialo", "Desactivá": "Desactiva", "desactivá": "desactiva",
              "usás": "usas", "Usás": "Usas", "comprobá": "comprueba", "Comprobá": "Comprueba",
              "mantenete": "mantente", "Mantenete": "Mantente", "buscás": "buscas", "Buscás": "Buscas",
              "ejecutá": "ejecuta", "Ejecutá": "Ejecuta"
          }
          for root in [Path("src"), Path("tools")]:
              for file in root.rglob("*"):
                  if not file.is_file() or file.suffix.lower() not in {".ts", ".tsx", ".js", ".jsx", ".mjs", ".md", ".txt"}:
                      continue
                  text = file.read_text(encoding="utf-8")
                  updated = text
                  for old, new in neutral_replacements.items(): updated = updated.replace(old, new)
                  if updated != text: file.write_text(updated, encoding="utf-8")
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          updated = text
          for old, new in neutral_replacements.items(): updated = updated.replace(old, new)
          if updated != text: readme.write_text(updated, encoding="utf-8")

          replace_exact("tools/check-public-privacy.mjs", '  path.join(root, "ops"),\n];', '  path.join(root, "ops"),\n  path.join(root, "tools"),\n];')
          replace_exact("tools/check-public-privacy.mjs", '  "next.config.ts",\n  "Dockerfile",\n  "docker-compose.yml",', '  "next.config.ts",')
          replace_exact("tools/check-public-privacy.mjs", '      /(?<![\\p{L}\\p{N}_])(?:vos|encontrá|consultá|explorá|seguí|compará|usá|elegí|buscá|descubrí|accedé|revisá|mirá|probá|conocé|aprendé|volvé|hacé|andá|vení|poné|sacá|dejá|agregá|quitá|cambiá|configurá|ejecutá|corregí|retirá|eliminá|subí|bajá|abrí|cerrá|guardá|podés|tenés|querés|sabés|sos|decís|venís|hacés)(?![\\p{L}\\p{N}_])/giu,', '      /(?<![\\p{L}\\p{N}_])(?:vos|encontrá|consultá|explorá|seguí|compará|combiná|usá|usás|elegí|buscá|buscás|descubrí|accedé|revisá|mirá|probá|conocé|aprendé|volvé|hacé|andá|vení|poné|sacá|dejá|agregá|quitá|cambiá|configurá|ejecutá|corregí|retirá|eliminá|subí|bajá|abrí|cerrá|guardá|conectá|desactivá|comprobá|mantenete|detenelo|arrancalo|podés|tenés|querés|sabés|sos|decís|venís|hacés)(?![\\p{L}\\p{N}_])/giu,')
          replace_exact("tools/check-public-privacy.mjs", 'const issues = [];\n', 'const issues = [];\nconst regionalCopyExemptions = new Set([\n  "tools/check-public-privacy.mjs",\n]);\n')
          replace_exact("tools/check-public-privacy.mjs", '  if (fileRelative.startsWith("src/")) {', '  if (!regionalCopyExemptions.has(fileRelative)) {')

          Path(".dockerignore").unlink()
          PY

      - name: Update Next and lockfile without force
        run: npm install --package-lock-only --save-exact --ignore-scripts next@16.3.3 eslint-config-next@16.3.3

      - name: Commit generated audit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: cerrar auditoría técnica y actualizar Next 16.3.3"
          git push origin HEAD:feature/game-detail-download-v2
