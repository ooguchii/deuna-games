name: Audit Finisher

on:
  push:
    branches:
      - feature/game-detail-download-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply audit fixes
        run: python3 tools/audit-finish.py

      - name: Update Next and lockfile without force
        run: npm install --package-lock-only --save-exact --ignore-scripts next@16.3.3 eslint-config-next@16.3.3

      - name: Commit generated audit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: cerrar auditoría técnica y actualizar Next 16.3.3"
          git push origin HEAD:feature/game-detail-download-v2
