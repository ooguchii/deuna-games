name: Card 3D Diagnostic

on:
  push:
    branches: [fix/restore-universal-card-3d]
    paths:
      - .github/workflows/card-3d-diagnostic-temp.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: 1
      DEUNA_ADMIN_ENABLED: "false"
      DEUNA_VISUAL_BASE_URL: http://127.0.0.1:3000
      DEUNA_VISUAL_OUTPUT_DIR: artifacts/card-3d-diagnostic
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/restore-universal-card-3d
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Instrument probe locally
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("tools/universal-game-card-3d-browser-smoke.mjs")
          text = path.read_text()
          start = text.index("async function waitForUniversalCard(cdp) {")
          end = text.index("async function readCardState(cdp) {", start)
          replacement = r'''async function waitForUniversalCard(cdp) {
            const deadline = Date.now() + 15_000;

            while (Date.now() < deadline) {
              const state = await cdp.evaluate(`
                (() => {
                  const card = Array.from(document.querySelectorAll("article"))
                    .find((element) =>
                      element instanceof HTMLElement &&
                      element.style.getPropertyValue("--tilt-x") !== "" &&
                      element.querySelector('a[href^="/juegos/"]')
                    );
                  if (!(card instanceof HTMLElement)) return null;
                  card.scrollIntoView({ block: "center", inline: "nearest" });
                  const reactKeys = Object.keys(card).filter((key) =>
                    key.startsWith("__reactProps$") ||
                    key.startsWith("__reactFiber$")
                  );
                  return {
                    hydrated: reactKeys.length > 0,
                    reactKeys: reactKeys.map((key) => key.split("$")[0]),
                  };
                })()
              `);
              if (state?.hydrated) {
                console.log("3D diagnostic hydration:", JSON.stringify(state));
                await delay(500);
                return;
              }
              await delay(100);
            }

            throw new Error(
              "No se encontró una UniversalGameCard hidratada en /juegos."
            );
          }

          '''
          text = text[:start] + replacement + text[end:]

          anchor = '''    await moveMouse(cdp, 1, 1);
              await moveMouse(
                cdp,
                initial.left + initial.width * 0.78,
                initial.top + initial.height * 0.28
              );'''
          if text.count(anchor) != 1:
              raise SystemExit(f"mouse anchor matches={text.count(anchor)}")
          replacement = '''    const probeX = initial.left + initial.width * 0.78;
              const probeY = initial.top + initial.height * 0.28;
              const hit = await cdp.evaluate(`
                (() => {
                  const card = Array.from(document.querySelectorAll("article"))
                    .find((element) =>
                      element instanceof HTMLElement &&
                      element.style.getPropertyValue("--tilt-x") !== "" &&
                      element.querySelector('a[href^="/juegos/"]')
                    );
                  if (!(card instanceof HTMLElement)) return null;
                  const x = ${probeX};
                  const y = ${probeY};
                  const target = document.elementFromPoint(x, y);
                  return {
                    x,
                    y,
                    insideCard: target instanceof Element && card.contains(target),
                    targetTag: target?.tagName ?? null,
                    targetClass: target instanceof Element ? target.className : null,
                    targetText: target?.textContent?.trim().slice(0, 80) ?? null,
                    cardRect: card.getBoundingClientRect().toJSON(),
                    readyState: document.readyState,
                  };
                })()
              `);
              console.log("3D diagnostic hit:", JSON.stringify(hit));
              if (!hit?.insideCard) {
                throw new Error(`El punto CDP no cae dentro de la Card: ${JSON.stringify(hit)}`);
              }

              await moveMouse(cdp, 1, 1);
              await moveMouse(cdp, probeX, probeY);'''
          text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY
          node --check tools/universal-game-card-3d-browser-smoke.mjs

      - name: Build production app
        run: npm run build

      - name: Run focused browser probe
        shell: bash
        run: |
          set -euo pipefail
          npm start > "$RUNNER_TEMP/deuna-card-3d-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/juegos > /dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/deuna-card-3d-app.log"
              exit 1
            fi
            sleep 1
          done
          node ./tools/universal-game-card-3d-browser-smoke.mjs
