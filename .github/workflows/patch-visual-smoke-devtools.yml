name: Patch visual smoke DevTools bootstrap

on:
  push:
    branches:
      - feat/unified-game-card-presentation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Align visual smoke with sitewide DevTools bootstrap
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/visual-smoke.mjs")
          source = path.read_text(encoding="utf-8")

          old_import = '''import {
            mkdtemp,
            mkdir,
            rm,
            writeFile,
          } from "node:fs/promises";'''
          new_import = '''import {
            mkdtemp,
            mkdir,
            readFile,
            rm,
            writeFile,
          } from "node:fs/promises";'''

          old_wait = '''async function waitForDebugger(port) {
            const deadline = Date.now() + 15_000;
            let lastError = null;

            while (Date.now() < deadline) {
              try {
                const response = await fetch(
                  `http://127.0.0.1:${port}/json/list`
                );
                if (response.ok) {
                  const targets = await response.json();
                  const page = targets.find(
                    (target) =>
                      target.type === "page" &&
                      target.webSocketDebuggerUrl
                  );
                  if (page) return page;
                }
              } catch (error) {
                lastError = error;
              }

              await delay(100);
            }

            throw new Error(
              `Chrome no expuso DevTools a tiempo.${
                lastError instanceof Error
                  ? ` ${lastError.message}`
                  : ""
              }`
            );
          }'''
          new_wait = '''async function waitForDebugger(profileDir, browser) {
            const activePortPath = path.join(profileDir, "DevToolsActivePort");
            const deadline = Date.now() + 30_000;
            let lastError = null;

            while (Date.now() < deadline) {
              if (browser.exitCode !== null) {
                throw new Error(
                  `Chrome terminó antes de exponer DevTools (exit ${browser.exitCode}).`
                );
              }

              try {
                const raw = await readFile(activePortPath, "utf8");
                const port = Number.parseInt(raw.split(/\\r?\\n/, 1)[0] ?? "", 10);
                if (!Number.isFinite(port) || port <= 0) {
                  throw new Error("Puerto DevTools inválido.");
                }
                const response = await fetch(
                  `http://127.0.0.1:${port}/json/list`
                );
                if (response.ok) {
                  const targets = await response.json();
                  const page = targets.find(
                    (target) =>
                      target.type === "page" &&
                      target.webSocketDebuggerUrl
                  );
                  if (page) return page;
                }
              } catch (error) {
                lastError = error;
              }

              await delay(100);
            }

            throw new Error(
              `Chrome no expuso DevTools a tiempo.${
                lastError instanceof Error
                  ? ` ${lastError.message}`
                  : ""
              }`
            );
          }'''

          replacements = [
              (old_import, new_import),
              (old_wait, new_wait),
              ("  const debugPort = 9222;\n", ""),
              ("      `--remote-debugging-port=${debugPort}`,", "      \"--remote-debugging-port=0\","),
              ("    const target = await waitForDebugger(debugPort);", "    const target = await waitForDebugger(profileDir, browser);"),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Replacement contract mismatch: expected 1 occurrence, got {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")

      - name: Verify focused diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- tools/visual-smoke.mjs
          grep -q 'remote-debugging-port=0' tools/visual-smoke.mjs
          grep -q 'DevToolsActivePort' tools/visual-smoke.mjs
          if grep -q 'const debugPort = 9222' tools/visual-smoke.mjs; then
            echo '::error::El puerto DevTools fijo sigue presente.'
            exit 1
          fi

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual-smoke.mjs
          git commit -m "test: harden Chrome DevTools bootstrap"
          git push origin "HEAD:${GITHUB_REF_NAME}"
