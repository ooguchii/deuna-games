name: Manual Search Polish V14.1

on:
  push:
    branches:
      - feature/game-detail-download-v2
    paths:
      - .github/workflows/manual-search-polish-v141.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-detail-download-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply V14.1 polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('src/features/game-finder/GameFinderClient.tsx')
          text = client.read_text()

          old = '''function filterManualOptions(\n  options: ManualSelectOption[],\n  query: string,\n  selectedValue: string\n) {\n  const normalizedQuery = normalizeManualSearch(query);\n  const terms = normalizedQuery.split(/\\s+/).filter(Boolean);\n  const matches = terms.length\n    ? options.filter((option) => {\n        const searchable = normalizeManualSearch(`${option.label} ${option.value}`);\n        return terms.every((term) => searchable.includes(term));\n      })\n    : options;'''
          new = '''function manualOptionMatches(option: ManualSelectOption, query: string) {\n  const terms = normalizeManualSearch(query).split(/\\s+/).filter(Boolean);\n  if (!terms.length) return true;\n\n  const searchable = normalizeManualSearch(`${option.label} ${option.value}`);\n  return terms.every((term) => searchable.includes(term));\n}\n\nfunction filterManualOptions(\n  options: ManualSelectOption[],\n  query: string,\n  selectedValue: string\n) {\n  const matches = query.trim()\n    ? options.filter((option) => manualOptionMatches(option, query))\n    : options;'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''  const normalizedQuery = normalizeManualSearch(searchValue);\n  const matchCount = normalizedQuery\n    ? visibleOptions.filter((option) => option.value !== value).length +\n      (visibleOptions.some((option) => option.value === value && normalizeManualSearch(`${option.label} ${option.value}`).includes(normalizedQuery)) ? 1 : 0)\n    : options.length;'''
          new = '''  const matchCount = searchValue.trim()\n    ? options.filter((option) => manualOptionMatches(option, searchValue)).length\n    : options.length;'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''  if (profile?.source === \"manual\") return \"Entrada manual\";\n  if (profile?.source === \"saved\") return \"Perfil local\";'''
          new = '''  if (profile?.source === \"manual\") {\n    return snapshot ? \"Manual + verificación web\" : \"Entrada manual\";\n  }\n  if (profile?.source === \"saved\") {\n    return snapshot ? \"Guardado + verificación web\" : \"Perfil local\";\n  }'''
          assert text.count(old) == 1
          client.write_text(text.replace(old, new, 1))

          browser = Path('src/features/game-finder/browser-detection.ts')
          text = browser.read_text()
          old = '''  const useDetectedOs =\n    detectedIsSpecific ||\n    confirmedProfile.osConfirmed !== true;'''
          new = '''  const useDetectedOs =\n    confirmedProfile.osConfirmed !== true &&\n    detectedOs !== \"Sistema sin confirmar\";'''
          assert text.count(old) == 1
          browser.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/manual-search-polish-v141.yml
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:data
          npm run check:css-modules
          npm run security:scan
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/game-finder/GameFinderClient.tsx src/features/game-finder/browser-detection.ts
          git commit -m "fix: pulir búsqueda y prioridad del perfil manual"
          git push origin HEAD:feature/game-detail-download-v2
