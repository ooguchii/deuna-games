name: Manual Combobox V15

on:
  push:
    branches:
      - feature/game-detail-download-v2
    paths:
      - .github/workflows/manual-combobox-v15.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-detail-download-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix transformer expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/manual-combobox-v15.py')
          text = path.read_text(encoding='utf-8')
          old = "assert text.count(reset_line) == 1\ntext = text.replace(reset_line, '', 1)"
          new = "assert text.count(reset_line) == 2\ntext = text.replace(reset_line, '')"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply integrated searchable selectors
        run: python3 tools/manual-combobox-v15.py
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:css-modules
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/manual-combobox-v15.yml tools/manual-combobox-v15.py
          git add src/features/game-finder/GameFinderClient.tsx src/features/game-finder/GameFinderClient.module.css
          git commit -m "feat: integrar búsqueda dentro de selectores manuales"
          git push origin HEAD:feature/game-detail-download-v2
