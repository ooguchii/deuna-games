name: Recommendations Fix V5

on:
  push:
    branches:
      - feature/game-detail-download-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply recommendation fix
        run: python3 tools/recommendations-fix-v5.py

      - name: Validate focused checks
        run: |
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:data
          npm run check:css-modules
          npm run security:scan -- --skip-npm-audit

      - name: Commit fix and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/recommendations-fix-v5.py .github/workflows/recommendations-fix-v5.yml
          git add src/features/game-finder/GameFinderClient.tsx src/features/game-finder/GameFinderUnifiedHero.tsx src/features/game-finder/GameFinderUnifiedHero.module.css
          git commit -m "fix: usar rendimiento real en recomendaciones"
          git push origin HEAD:feature/game-detail-download-v2
