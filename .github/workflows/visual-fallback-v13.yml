name: Visual Fallback V13

on:
  push:
    branches:
      - feature/game-detail-download-v2
    paths:
      - .github/workflows/visual-fallback-v13.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-detail-download-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply V13 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          perf = Path('src/features/game-finder/performance-data.ts')
          text = perf.read_text()
          old = '''export function getPerformanceProfile(slug: string): GamePerformanceProfile {\n  return (\n    profileMap.get(slug) ?? {\n      slug,\n      referenceFps: 72,\n      ramGb: 8,\n      cpuWeight: 0.3,\n      gpuWeight: 0.7,\n      optimization: 0.95,\n    }\n  );\n}'''
          new = '''export function getPerformanceProfile(slug: string): GamePerformanceProfile {\n  const profile = profileMap.get(slug);\n\n  if (!profile) {\n    throw new Error(`No existe un perfil de rendimiento para "${slug}".`);\n  }\n\n  return profile;\n}'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          perf.write_text(text)

          hero = Path('src/features/game-finder/GameFinderUnifiedHero.tsx')
          text = hero.read_text()
          old = '''          Descubre los juegos que\n          <strong> tu PC puede correr</strong>'''
          new = '''          Descubre los juegos{"\\u00a0"}que\n          <strong> tu PC puede correr</strong>'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          hero.write_text(text)

          css = Path('src/features/game-finder/GameFinderUnifiedHero.module.css')
          text = css.read_text()

          old = '''.profileTitleLine {\n  min-width: 0;\n\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px;\n\n  margin-top: 5px;\n}'''
          new = '''.profileTitleLine {\n  min-width: 0;\n\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n  align-items: start;\n  gap: 2px;\n\n  margin-top: 5px;\n}'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''.profileTitleLine small {\n  flex: 0 0 auto;\n\n  color: #aab4c2;'''
          new = '''.profileTitleLine small {\n  color: #aab4c2;'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''.profileHint {\n  overflow: hidden;\n\n  margin-top: 3px;\n\n  color: #8f9bab;\n\n  font-size: 8px;\n  font-weight: 580;\n  line-height: 1.38;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}'''
          new = '''.profileHint {\n  overflow: hidden;\n\n  display: -webkit-box;\n  margin-top: 3px;\n\n  color: #8f9bab;\n\n  font-size: 8px;\n  font-weight: 580;\n  line-height: 1.38;\n  -webkit-box-orient: vertical;\n  -webkit-line-clamp: 2;\n}'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''@media (max-width: 430px) {\n  .profileTitleLine {\n    align-items: flex-start;\n    flex-direction: column;\n    gap: 3px;\n  }'''
          new = '''@media (max-width: 430px) {\n  .profileTitleLine {\n    gap: 3px;\n  }'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          css.write_text(text)
          PY
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:data
          npm run check:css-modules
          npm run security:scan
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/visual-fallback-v13.yml
          git add src/features/game-finder/performance-data.ts src/features/game-finder/GameFinderUnifiedHero.tsx src/features/game-finder/GameFinderUnifiedHero.module.css
          git commit -m "fix: eliminar fallback FPS y pulir hero"
          git push origin HEAD:feature/game-detail-download-v2
