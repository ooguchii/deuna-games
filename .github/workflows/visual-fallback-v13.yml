name: Visual Fallback V13

on:
  push:
    branches: [feature/game-detail-download-v2]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-detail-download-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply V13 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          perf_path = Path('src/features/game-finder/performance-data.ts')
          perf = perf_path.read_text(encoding='utf-8')
          old = '''export function getPerformanceProfile(slug: string): GamePerformanceProfile {
            return (
              profileMap.get(slug) ?? {
                slug,
                referenceFps: 72,
                ramGb: 8,
                cpuWeight: 0.3,
                gpuWeight: 0.7,
                optimization: 0.95,
              }
            );
          }'''
          # Match the exact source without relying on indentation introduced by YAML.
          old = old.replace('          ', '')
          new = '''export function getPerformanceProfile(slug: string): GamePerformanceProfile {
            const profile = profileMap.get(slug);

            if (!profile) {
              throw new Error(`No existe un perfil de rendimiento para "${slug}".`);
            }

            return profile;
          }'''.replace('          ', '')
          if old not in perf:
              raise SystemExit('No se encontró el fallback FPS esperado')
          perf_path.write_text(perf.replace(old, new, 1), encoding='utf-8')

          hero_path = Path('src/features/game-finder/GameFinderUnifiedHero.tsx')
          hero = hero_path.read_text(encoding='utf-8')
          old_heading = '          Descubre los juegos que\n'
          new_heading = '          Descubre los juegos{"\\u00a0"}que\n'
          if old_heading not in hero:
              raise SystemExit('No se encontró el título esperado del hero')
          hero_path.write_text(hero.replace(old_heading, new_heading, 1), encoding='utf-8')

          css_path = Path('src/features/game-finder/GameFinderUnifiedHero.module.css')
          css = css_path.read_text(encoding='utf-8')

          old_title = '''.profileTitleLine {
            min-width: 0;

            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;

            margin-top: 5px;
          }'''.replace('          ', '')
          new_title = '''.profileTitleLine {
            min-width: 0;

            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-items: start;
            gap: 2px;

            margin-top: 5px;
          }'''.replace('          ', '')
          if old_title not in css:
              raise SystemExit('No se encontró profileTitleLine esperado')
          css = css.replace(old_title, new_title, 1)

          css = css.replace('''.profileTitleLine small {
            flex: 0 0 auto;

            color: #aab4c2;'''.replace('          ', ''), '''.profileTitleLine small {
            color: #aab4c2;'''.replace('          ', ''), 1)

          old_hint = '''.profileHint {
            overflow: hidden;

            margin-top: 3px;

            color: #8f9bab;

            font-size: 8px;
            font-weight: 580;
            line-height: 1.38;
            text-overflow: ellipsis;
            white-space: nowrap;
          }'''.replace('          ', '')
          new_hint = '''.profileHint {
            overflow: hidden;

            display: -webkit-box;
            margin-top: 3px;

            color: #8f9bab;

            font-size: 8px;
            font-weight: 580;
            line-height: 1.38;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }'''.replace('          ', '')
          if old_hint not in css:
              raise SystemExit('No se encontró profileHint esperado')
          css = css.replace(old_hint, new_hint, 1)

          old_mobile = '''@media (max-width: 430px) {
            .profileTitleLine {
              align-items: flex-start;
              flex-direction: column;
              gap: 3px;
            }
'''.replace('          ', '')
          new_mobile = '''@media (max-width: 430px) {
            .profileTitleLine {
              gap: 3px;
            }
'''.replace('          ', '')
          if old_mobile not in css:
              raise SystemExit('No se encontró override móvil esperado')
          css = css.replace(old_mobile, new_mobile, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

          git rm .github/workflows/visual-fallback-v13.yml

      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:data
          npm run check:css-modules
          npm run security:scan

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: eliminar fallback FPS y pulir hero'
          git push origin HEAD:feature/game-detail-download-v2
