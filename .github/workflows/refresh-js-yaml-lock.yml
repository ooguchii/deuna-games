name: Refresh js-yaml lock

on:
  push:
    branches:
      - feat/unified-game-card-presentation

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install current lock
        run: npm ci --no-audit --no-fund

      - name: Refresh vulnerable transitive dependency
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Verify narrow lock update
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const lock = JSON.parse(await readFile("package-lock.json", "utf8"));
          const jsYaml = lock.packages?.["node_modules/js-yaml"];
          if (jsYaml?.version !== "4.3.2") {
            throw new Error(`js-yaml esperado 4.3.2, recibido ${jsYaml?.version ?? "ausente"}`);
          }
          NODE
          git diff -- package-lock.json > refresh-js-yaml-lock.diff

      - name: Upload refreshed lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: refreshed-js-yaml-lock-${{ github.sha }}
          path: |
            package-lock.json
            refresh-js-yaml-lock.diff
          if-no-files-found: error
          retention-days: 1
