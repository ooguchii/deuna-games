name: Focused Game V8

on:
  push:
    branches:
      - feature/game-detail-download-v2
    paths:
      - .github/workflows/focused-game-v8.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/game-detail-download-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused-game fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const clientPath = 'src/features/game-finder/GameFinderClient.tsx';
          let client = fs.readFileSync(clientPath, 'utf8');

          const oldProps = `type GameFinderClientProps = {\n  games: Game[];\n};`;
          const newProps = `type GameFinderClientProps = {\n  games: Game[];\n  focusedSlug?: string;\n};`;
          if (!client.includes(oldProps)) throw new Error('Props esperadas no encontradas');
          client = client.replace(oldProps, newProps);

          const oldSignature = `export default function GameFinderClient({ games }: GameFinderClientProps) {`;
          const newSignature = `export default function GameFinderClient({\n  games,\n  focusedSlug,\n}: GameFinderClientProps) {`;
          if (!client.includes(oldSignature)) throw new Error('Firma esperada no encontrada');
          client = client.replace(oldSignature, newSignature);

          const oldSelected = `  const [view, setView] = useState<ViewMode>(\"grid\");\n  const [selectedSlug, setSelectedSlug] = useState(games[0]?.slug ?? \"\");\n  const [favorites, setFavorites] = useState<Set<string>>(() => new Set());`;
          const newSelected = `  const [view, setView] = useState<ViewMode>(\"grid\");\n  const validFocusedSlug =\n    focusedSlug && games.some((game) => game.slug === focusedSlug)\n      ? focusedSlug\n      : undefined;\n  const [selectedGameState, setSelectedGameState] = useState(() => ({\n    focusKey: validFocusedSlug,\n    slug: validFocusedSlug ?? games[0]?.slug ?? \"\",\n  }));\n  const storedSelectionIsValid = games.some(\n    (game) => game.slug === selectedGameState.slug\n  );\n  const selectedSlug =\n    selectedGameState.focusKey === validFocusedSlug &&\n    storedSelectionIsValid\n      ? selectedGameState.slug\n      : validFocusedSlug ?? games[0]?.slug ?? \"\";\n  const [favorites, setFavorites] = useState<Set<string>>(() => new Set());`;
          if (!client.includes(oldSelected)) throw new Error('Estado selectedSlug esperado no encontrado');
          client = client.replace(oldSelected, newSelected);

          const functionAnchor = `  function toggleFavorite(slug: string) {`;
          const selectionSetter = `  function setSelectedSlug(slug: string) {\n    setSelectedGameState({\n      focusKey: validFocusedSlug,\n      slug,\n    });\n  }\n\n`;
          if (!client.includes(functionAnchor)) throw new Error('Ancla de selección no encontrada');
          client = client.replace(functionAnchor, selectionSetter + functionAnchor);

          fs.writeFileSync(clientPath, client);

          const pagePath = 'src/app/requisitos/page.tsx';
          let page = fs.readFileSync(pagePath, 'utf8');

          const oldMeta = `  const hasFocusedGame =\n    typeof params.juego === \"string\" &&\n    params.juego.length > 0;`;
          const newMeta = `  const hasFocusedGame =\n    typeof params.juego === \"string\" &&\n    games.some((game) => game.slug === params.juego);`;
          if (!page.includes(oldMeta)) throw new Error('Metadata focus esperado no encontrado');
          page = page.replace(oldMeta, newMeta);

          const oldOrder = `  const { juego } = await searchParams;\n  const requestedIndex =\n    typeof juego === \"string\"\n      ? games.findIndex(\n          (game) => game.slug === juego\n        )\n      : -1;\n\n  const orderedGames =\n    requestedIndex > 0\n      ? [\n          games[requestedIndex],\n          ...games.slice(0, requestedIndex),\n          ...games.slice(requestedIndex + 1),\n        ]\n      : games;`;
          const newOrder = `  const { juego } = await searchParams;\n  const focusedSlug =\n    typeof juego === \"string\" &&\n    games.some((game) => game.slug === juego)\n      ? juego\n      : undefined;`;
          if (!page.includes(oldOrder)) throw new Error('Reordenamiento esperado no encontrado');
          page = page.replace(oldOrder, newOrder);

          const oldRender = `        <GameFinderClient games={orderedGames} />`;
          const newRender = `        <GameFinderClient\n          games={games}\n          focusedSlug={focusedSlug}\n        />`;
          if (!page.includes(oldRender)) throw new Error('Render esperado no encontrado');
          page = page.replace(oldRender, newRender);

          fs.writeFileSync(pagePath, page);
          NODE

      - name: Validate focused checks
        run: |
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run check:routes
          npm run check:data

      - name: Commit fix and remove temporary automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/focused-game-v8.yml
          git add src/features/game-finder/GameFinderClient.tsx src/app/requisitos/page.tsx
          git commit -m "fix: sincronizar juego enfocado sin reordenar catálogo"
          git push origin HEAD:feature/game-detail-download-v2
