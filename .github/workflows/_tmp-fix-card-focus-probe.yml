name: Temporary card focus probe patcher

on:
  push:
    branches:
      - feat/unified-game-card-presentation
    paths:
      - .github/workflows/_tmp-fix-card-focus-probe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/unified-game-card-presentation
          fetch-depth: 1
      - name: Replace unbounded page-side animation waits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/sitewide-browser-smoke.mjs")
          source = path.read_text(encoding="utf-8")
          old = r'''      const focused = await cdp.evaluate(`
        (async () => {
          const card = document.querySelector('article[data-card-presentation="poster"]');
          const link = card?.querySelector('a[href^="/juegos/"]');
          if (!(card instanceof HTMLElement) || !(link instanceof HTMLAnchorElement)) {
            return { found: false };
          }
          link.focus();
          await new Promise((resolve) =>
            requestAnimationFrame(() => requestAnimationFrame(resolve))
          );
          const rect = card.getBoundingClientRect();
          return {
            found: true,
            revealed: card.dataset.posterRevealed ?? null,
            activeLink: document.activeElement === link,
            width: rect.width,
            height: rect.height,
          };
        })()
      `);

      const blurred = await cdp.evaluate(`
        (async () => {
          const card = document.querySelector('article[data-card-presentation="poster"]');
          const link = card?.querySelector('a[href^="/juegos/"]');
          if (!(card instanceof HTMLElement) || !(link instanceof HTMLAnchorElement)) {
            return { found: false };
          }
          link.blur();
          await new Promise((resolve) =>
            requestAnimationFrame(() => requestAnimationFrame(resolve))
          );
          const rect = card.getBoundingClientRect();
          return {
            found: true,
            revealed: card.dataset.posterRevealed ?? null,
            activeLink: document.activeElement === link,
            width: rect.width,
            height: rect.height,
          };
        })()
      `);
'''
          new = r'''      const focusApplied = await cdp.evaluate(`
        (() => {
          const card = document.querySelector('article[data-card-presentation="poster"]');
          const link = card?.querySelector('a[href^="/juegos/"]');
          if (!(link instanceof HTMLAnchorElement)) return false;
          link.focus();
          return document.activeElement === link;
        })()
      `);
      await delay(100);
      const focused = await cdp.evaluate(`
        (() => {
          const card = document.querySelector('article[data-card-presentation="poster"]');
          const link = card?.querySelector('a[href^="/juegos/"]');
          if (!(card instanceof HTMLElement) || !(link instanceof HTMLAnchorElement)) {
            return { found: false };
          }
          const rect = card.getBoundingClientRect();
          return {
            found: true,
            revealed: card.dataset.posterRevealed ?? null,
            activeLink: document.activeElement === link,
            width: rect.width,
            height: rect.height,
          };
        })()
      `);

      const blurApplied = await cdp.evaluate(`
        (() => {
          const card = document.querySelector('article[data-card-presentation="poster"]');
          const link = card?.querySelector('a[href^="/juegos/"]');
          if (!(link instanceof HTMLAnchorElement)) return false;
          link.blur();
          return document.activeElement !== link;
        })()
      `);
      await delay(100);
      const blurred = await cdp.evaluate(`
        (() => {
          const card = document.querySelector('article[data-card-presentation="poster"]');
          const link = card?.querySelector('a[href^="/juegos/"]');
          if (!(card instanceof HTMLElement) || !(link instanceof HTMLAnchorElement)) {
            return { found: false };
          }
          const rect = card.getBoundingClientRect();
          return {
            found: true,
            revealed: card.dataset.posterRevealed ?? null,
            activeLink: document.activeElement === link,
            width: rect.width,
            height: rect.height,
          };
        })()
      `);
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one focus/blur block, found {count}")
          source = source.replace(old, new)
          source = source.replace(
              'if (!focused.found || focused.revealed !== "true" || !focused.activeLink) {',
              'if (!focusApplied || !focused.found || focused.revealed !== "true" || !focused.activeLink) {'
          )
          source = source.replace(
              'if (!blurred.found || blurred.revealed !== "false" || blurred.activeLink) {',
              'if (!blurApplied || !blurred.found || blurred.revealed !== "false" || blurred.activeLink) {'
          )
          source = source.replace(
              'focused.found && focused.revealed === "true" && focused.activeLink &&\n          blurred.found && blurred.revealed === "false" && !blurred.activeLink &&',
              'focusApplied && focused.found && focused.revealed === "true" && focused.activeLink &&\n          blurApplied && blurred.found && blurred.revealed === "false" && !blurred.activeLink &&'
          )
          source = source.replace(
              'nativeFineHover: initial.nativeFineHover,',
              'focusApplied,\n        blurApplied,\n        nativeFineHover: initial.nativeFineHover,'
          )
          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          git diff -- tools/sitewide-browser-smoke.mjs
          if git grep -n 'requestAnimationFrame(() => requestAnimationFrame(resolve))' -- tools/sitewide-browser-smoke.mjs | grep -q '8[0-9][0-9]\|9[0-9][0-9]'; then
            echo '::error::La sonda Card conserva una espera rAF no acotada.'
            exit 1
          fi
      - name: Commit bounded probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sitewide-browser-smoke.mjs
          git commit -m "test: bound card focus interaction probe"
          git push origin HEAD:feat/unified-game-card-presentation
